<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Border / Glass Edge -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.25" stroke-dasharray="8 8" />

  <!-- Background Glow Orb -->
  <circle cx="256" cy="256" r="120" fill="url(#primaryGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Modern Hub / Portal Emblem -->
  <g filter="url(#shadow)">
    <!-- Central Hexagonal / Diamond Shield -->
    <path d="M 256 112 
             L 376 182 
             L 376 330 
             L 256 400 
             L 136 330 
             L 136 182 Z" 
          fill="url(#primaryGrad)" 
          stroke="rgba(255, 255, 255, 0.4)" 
          stroke-width="5" />
    
    <!-- Inner Core Cutout & Futuristic Nodes -->
    <path d="M 256 168 
             L 332 212 
             L 332 300 
             L 256 344 
             L 180 300 
             L 180 212 Z" 
          fill="#090d16" 
          opacity="0.85" />

    <!-- Radiant Center Diamond -->
    <path d="M 256 208 
             L 296 256 
             L 256 304 
             L 216 256 Z" 
          fill="url(#accentGrad)" 
          filter="url(#glow)" />

    <!-- Dynamic Accent Sparks -->
    <circle cx="256" cy="112" r="10" fill="#38bdf8" />
    <circle cx="376" cy="182" r="9" fill="#8b5cf6" />
    <circle cx="376" cy="330" r="9" fill="#06b6d4" />
    <circle cx="256" cy="400" r="10" fill="#ec4899" />
    <circle cx="136" cy="330" r="9" fill="#6366f1" />
    <circle cx="136" cy="182" r="9" fill="#38bdf8" />
  </g>
</svg>
